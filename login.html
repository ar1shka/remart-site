<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>РемАрт — Вход</title>

  <link rel="stylesheet" href="/src/login.css">
</head>

<body>

  <main class="login">

    <div class="login__card">

      <div class="login__logo">
        РЕМАРТ
      </div>

      <div class="login__line"></div>

      <span class="login__label">
        Панель управления
      </span>

      <h1 class="login__title">
        Вход
      </h1>

      <form class="login__form">

        <label class="login__field">
          <span>Логин</span>

          <input
            type="text"
            name="login"
            autocomplete="username"
            required
          >
        </label>

        <label class="login__field">
          <span>Пароль</span>

          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button
          class="login__button"
          type="submit"
        >
          Войти
        </button>

        <p
          class="login__error"
          id="login-error"
        ></p>

      </form>

      <a
        class="login__back"
        href="/"
      >
        ← Вернуться на сайт
      </a>

    </div>

  </main>

  <script type="module" src="/src/login.js"></script>

</body>
</html>
